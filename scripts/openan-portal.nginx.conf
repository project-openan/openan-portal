# OpenAN Portal nginx 配置模板
# 由 deploy.sh 安装为 /etc/nginx/conf.d/openan-portal.conf
# __PORT1__ / __PORT2__ 会被替换为实际端口（默认 9003 / 3003）
server {
    listen __PORT1__;
    listen __PORT2__;
    server_name _;
    root "__WEB_ROOT__";
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 插件 UMD 包（portal/public/plugins/ 构建时复制进 dist/plugins/）
    location ^~ /plugins/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ===== 后端网关（按目标机器实际服务端口调整） =====

    # 编排中心后端（workflow-designer 插件 + portal 认证），FastAPI 默认 :5001
    location /api/orchestrate/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /rest/v1/orchestrate/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 注册中心后端，FastAPI 默认 :5000
    location /api/registry-center/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # 旧版网关路径（历史插件）
    location /api/registry/ {
        rewrite ^/api/registry/rest/v1/registry(/|$)(.*)$ /rest/v1/registry-center/$2 break;
        rewrite ^/api/registry/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /rest/v1/registry-center/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 可观测服务只读入口；事件/拓扑上报仍由组件服务独立管理。
    location /api/observe/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
