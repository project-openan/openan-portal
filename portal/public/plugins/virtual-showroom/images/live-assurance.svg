<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1c0f26"/>
      <stop offset="1" stop-color="#3a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.65">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#e11d48" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- LIVE badge -->
  <g transform="translate(48,88)">
    <rect width="86" height="34" rx="17" fill="#e11d48"/>
    <circle cx="22" cy="17" r="5" fill="#fff"/>
    <text x="48" y="24" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">LIVE</text>
  </g>

  <!-- broadcast tower + signal waves -->
  <g transform="translate(672,120)" stroke="#fb7185" fill="none" stroke-linecap="round">
    <path d="M0 64 L -26 128 M0 64 L 26 128 M -14 96 L 14 96 M -22 112 L 22 112" stroke-width="3"/>
    <circle cx="0" cy="58" r="7" fill="#fb7185" stroke="none"/>
    <path d="M -22 34 A 31 31 0 0 1 22 34" stroke-width="3" stroke-opacity="0.85"/>
    <path d="M -36 16 A 51 51 0 0 1 36 16" stroke-width="3" stroke-opacity="0.55"/>
    <path d="M -50 -2 A 71 71 0 0 1 50 -2" stroke-width="3" stroke-opacity="0.3"/>
  </g>

  <!-- storyline flow: intent → wireless → livestream → aggregate -->
  <path d="M80 330 C 180 258, 250 356, 345 300 S 520 216, 618 262 S 716 318, 756 300"
        fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
  <g fill="#0b1020" stroke="#fb7185" stroke-width="2.5">
    <circle cx="80" cy="330" r="9"/>
    <circle cx="240" cy="318" r="9"/>
    <circle cx="345" cy="300" r="11"/>
    <circle cx="520" cy="240" r="9"/>
    <circle cx="618" cy="262" r="11"/>
  </g>
  <g fill="#fb7185">
    <circle cx="345" cy="300" r="4"/>
    <circle cx="618" cy="262" r="4"/>
  </g>

  <!-- domain agents -->
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g>
      <rect x="84" y="126" width="150" height="52" rx="10" fill="#231427" stroke="#5c2337" stroke-width="1.5"/>
      <text x="159" y="158" font-size="19" fill="#ffc4cd">保障宿主</text>
    </g>
    <g>
      <rect x="320" y="98" width="150" height="52" rx="10" fill="#231427" stroke="#5c2337" stroke-width="1.5"/>
      <text x="395" y="130" font-size="19" fill="#ffc4cd">无线域打桩</text>
    </g>
    <g>
      <rect x="556" y="200" width="150" height="52" rx="10" fill="#231427" stroke="#5c2337" stroke-width="1.5"/>
      <text x="631" y="232" font-size="19" fill="#ffc4cd">直播域打桩</text>
    </g>
    <path d="M234 152 L 320 124" stroke="#5c2337" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M470 150 L 556 226" stroke="#5c2337" stroke-width="2" stroke-dasharray="5 6"/>
  </g>

  <!-- video badge -->
  <g transform="translate(240,216)">
    <circle r="28" fill="#0b1020" stroke="url(#accent)" stroke-width="3"/>
    <path d="M -7 -12 L 14 0 L -7 12 Z" fill="#fb7185"/>
  </g>

  <!-- titles -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="64" font-size="40" font-weight="700" fill="#ffe8ec" letter-spacing="1">LIVE ASSURANCE DEMO</text>
    <text x="48" y="394" font-size="24" fill="#e8a8b4" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">大型赛事直播业务保障 · 意图解析 · 双域诊断 · 保障结论</text>
    <rect x="48" y="410" width="72" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
</svg>
