<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101b38"/>
      <stop offset="1" stop-color="#14305c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3f76e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.65">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#3f76e0" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- storyline flow -->
  <path d="M80 330 C 180 250, 240 360, 340 300 S 520 210, 620 260 S 720 320, 760 300"
        fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
  <g fill="#0b1020" stroke="#38bdf8" stroke-width="2.5">
    <circle cx="80" cy="330" r="9"/>
    <circle cx="240" cy="322" r="9"/>
    <circle cx="340" cy="300" r="11"/>
    <circle cx="520" cy="238" r="9"/>
    <circle cx="620" cy="260" r="11"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="340" cy="300" r="4"/>
    <circle cx="620" cy="260" r="4"/>
  </g>

  <!-- agent nodes -->
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g>
      <rect x="90" y="120" width="128" height="52" rx="10" fill="#16233f" stroke="#2c4a7a" stroke-width="1.5"/>
      <text x="154" y="152" font-size="19" fill="#9fd8ff">呼叫中心</text>
    </g>
    <g>
      <rect x="330" y="96" width="128" height="52" rx="10" fill="#16233f" stroke="#2c4a7a" stroke-width="1.5"/>
      <text x="394" y="128" font-size="19" fill="#9fd8ff">计费 / CDN</text>
    </g>
    <g>
      <rect x="576" y="120" width="128" height="52" rx="10" fill="#16233f" stroke="#2c4a7a" stroke-width="1.5"/>
      <text x="640" y="152" font-size="19" fill="#9fd8ff">NOC 定界</text>
    </g>
    <path d="M218 146 L 330 122" stroke="#2c4a7a" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M458 122 L 576 146" stroke="#2c4a7a" stroke-width="2" stroke-dasharray="5 6"/>
  </g>

  <!-- play badge -->
  <g transform="translate(394,242)">
    <circle r="30" fill="#0b1020" stroke="url(#accent)" stroke-width="3"/>
    <path d="M -8 -13 L 15 0 L -8 13 Z" fill="#38bdf8"/>
  </g>

  <!-- titles -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="64" font-size="40" font-weight="700" fill="#e8f2ff" letter-spacing="1">A2A-T OBSERVATION</text>
    <text x="48" y="394" font-size="24" fill="#8fb8e8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">多智能体协作 · 观测大屏 · 故事线回放</text>
    <rect x="48" y="410" width="72" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
</svg>
